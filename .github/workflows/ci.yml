name: CI

on:
  push:
    branches:
      - main
      - 'workkeel/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - id: install
        name: Install pinned dependencies
        if: ${{ always() }}
        run: npm ci --ignore-scripts
      - id: doctor
        name: Native clean-clone entrypoint and publication boundary
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          node ./bin/workkeel.mjs start .
          npm run check:source-checkout
          npm run check:publication
          npm run check:public-history
      - id: verify
        name: Verify — repository checks and full contract suite
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          npm run verify
          npm run check:source-checkout
      - name: Report verification results
        if: ${{ always() }}
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            echo "### CI verification"
            echo
            echo "- Runtime: \`Node.js 24\`"
            echo "- Dependency install: \`$INSTALL_OUTCOME\`"
            echo "- Clean-clone entrypoint and publication boundary: \`$DOCTOR_OUTCOME\`"
            echo "- npm run verify: \`$VERIFY_OUTCOME\`"
            echo
            echo "Release publishing reruns verification. Browser verification remains local."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce aggregated verification result
        if: ${{ always() }}
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DOCTOR_OUTCOME: ${{ steps.doctor.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          failed=0
          require_success() {
            if [ "$2" != "success" ]; then
              echo "$1 failed or did not run: $2"
              failed=1
            fi
          }
          require_success "Dependency install" "$INSTALL_OUTCOME"
          require_success "Clean-clone entrypoint and publication boundary" "$DOCTOR_OUTCOME"
          require_success "Verification" "$VERIFY_OUTCOME"
          exit "$failed"
