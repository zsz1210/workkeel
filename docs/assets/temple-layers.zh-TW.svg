<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Temple Concept Layers</title>
  <desc id="desc">在人類方向與權限之下，依序整理責任、工作、引導、協作、保證、記憶與學習六項關切；以版本庫為基礎的組織記憶支撐所有分層。Context Routing 與 Adaptive Execution Routing 是不同的判斷。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
    .title { fill: #f8fafc; font-size: 28px; font-weight: 650; }
    .subtitle { fill: #94a3b8; font-size: 15px; }
    .eyebrow { fill: #7dd3fc; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
    .name { fill: #f8fafc; font-size: 18px; font-weight: 650; }
    .question { fill: #cbd5e1; font-size: 15px; }
    .mechanism { fill: #94a3b8; font-size: 14px; }
    .index { fill: #5eead4; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  </style>
  <rect width="1200" height="650" rx="18" fill="#0b0f14"/>
  <text x="48" y="48" class="title">Temple Concept Layers</text>
  <text x="48" y="74" class="subtitle">Temple 放進版本庫裡的組織結構；每個分層回答不同問題。</text>
  <rect x="48" y="100" width="1104" height="66" rx="12" fill="#142033" stroke="#60a5fa"/>
  <text x="72" y="126" class="eyebrow">人類方向與權限</text>
  <text x="72" y="150" class="question">目標 · 優先順序 · 商業事實 · 核准邊界</text>
  <line x1="76" y1="185" x2="76" y2="556" stroke="#2dd4bf" stroke-width="2"/>
  <g transform="translate(48 184)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#111820" stroke="#263341"/><text x="70" y="25" class="index">L1</text><text x="116" y="25" class="name">責任</text><text x="370" y="25" class="question">誰負責、誰能核准？</text><text x="370" y="48" class="mechanism">Position · Agent Identity · Assignment · 執行者可更換，責任位置保持穩定</text></g>
  <g transform="translate(48 254)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#0f161d" stroke="#263341"/><text x="70" y="25" class="index">L2</text><text x="116" y="25" class="name">工作</text><text x="370" y="25" class="question">核准了什麼成果與邊界？</text><text x="370" y="48" class="mechanism">Spec · Work Item · 驗收條件 · 更換 task 或對話後仍能延續</text></g>
  <g transform="translate(48 324)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#0e2525" stroke="#2dd4bf"/><text x="70" y="25" class="index">L3</text><text x="116" y="25" class="name">引導</text><text x="370" y="25" class="question">該讀什麼、這一步該怎麼執行？</text><text x="370" y="48" class="mechanism">Context Route · Skill · Adaptive Execution Route · 分開知識與執行方式</text></g>
  <g transform="translate(48 394)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#0f161d" stroke="#263341"/><text x="70" y="25" class="index">L4</text><text x="116" y="25" class="name">協作</text><text x="370" y="25" class="question">人與 Agent 之間如何安全推進？</text><text x="370" y="48" class="mechanism">Claim · 相依關係 · 平行工作 · Handoff · 讓重疊與整合責任保持可見</text></g>
  <g transform="translate(48 464)"><circle cx="28" cy="31" r="7" fill="#fbbf24"/><rect x="48" width="1056" height="62" rx="10" fill="#251f11" stroke="#f59e0b"/><text x="70" y="25" class="index" style="fill:#fbbf24">L5</text><text x="116" y="25" class="name">保證</text><text x="370" y="25" class="question">什麼證據足以支持下一個決定？</text><text x="370" y="48" class="mechanism">Test · Evaluation · Independent QA · Release Gate · 各自獨立檢查不同主張</text></g>
  <g transform="translate(48 534)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#111820" stroke="#263341"/><text x="70" y="25" class="index">L6</text><text x="116" y="25" class="name">記憶與學習</text><text x="370" y="25" class="question">下一個 task 能復原並改善什麼？</text><text x="370" y="48" class="mechanism">Evidence · Decision · Lesson · Recovery · 學習確認後才可能成為方針</text></g>
  <rect x="48" y="612" width="1104" height="2" fill="#475569"/>
  <text x="48" y="637" class="eyebrow" style="fill:#cbd5e1">以版本庫為基礎的組織記憶 · 正式 · 版本化 · 可復原</text>
</svg>
