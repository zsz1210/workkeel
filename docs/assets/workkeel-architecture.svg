<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="1420" viewBox="0 0 1216 1420" role="img" aria-labelledby="title desc">
<title id="title">Workkeel architecture in four explanatory layers</title><desc id="desc">Task agreement defines authority. Coordination guards task states and optionally routes graph nodes. A coding runtime operates host-approved tools. Evidence and exact-candidate review determine acceptance. Optional runner checkpoints are not acceptance records.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536a7c" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="44" font-size="32" font-weight="600" fill="#1d3041">Workkeel · four layers</text><text x="32" y="78" font-size="22" font-weight="400" fill="#1d3041">Agreement → coordination → execution → evidence</text><rect x="32" y="108" width="1152" height="290" rx="16" fill="#e8f0fa" stroke="#c8d3dc"/><text x="56" y="151" font-size="26" font-weight="600" fill="#285b8b">01</text><text x="112" y="151" font-size="29" font-weight="600" fill="#1d3041">Task agreement</text><text x="949" y="150" font-size="18" font-weight="600" fill="#285b8b">CORE</text><text x="56" y="188" font-size="22" font-weight="400" fill="#1d3041">What is allowed, and what counts as done?</text><rect x="56" y="213" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="74" y="247" font-size="24" font-weight="600" fill="#1d3041">Goal + acceptance</text><text x="74" y="281" font-size="21" font-weight="400" fill="#1d3041">One bounded change</text><text x="74" y="309" font-size="21" font-weight="400" fill="#1d3041">with checkable results</text><path d="M410 274H428" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="213" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="450" y="247" font-size="24" font-weight="600" fill="#1d3041">Environment + authority</text><text x="450" y="281" font-size="21" font-weight="400" fill="#1d3041">Read/write roots, tools,</text><text x="450" y="309" font-size="21" font-weight="400" fill="#1d3041">data policy and expiry</text><path d="M786 274H804" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="808" y="213" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="826" y="247" font-size="24" font-weight="600" fill="#1d3041">Task contract</text><text x="826" y="281" font-size="21" font-weight="400" fill="#1d3041">An approved record</text><text x="826" y="309" font-size="21" font-weight="400" fill="#1d3041">beside your code</text><text x="56" y="369" font-size="19" font-weight="400" fill="#1d3041">Principle: repository-native state. A conversation is not the source of authority.</text><path d="M608 400V422" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="424" width="1152" height="290" rx="16" fill="#e6f3ec" stroke="#c8d3dc"/><text x="56" y="467" font-size="26" font-weight="600" fill="#226b4d">02</text><text x="112" y="467" font-size="29" font-weight="600" fill="#1d3041">Coordination</text><text x="949" y="466" font-size="18" font-weight="600" fill="#226b4d">CORE + OPT-IN</text><text x="56" y="504" font-size="22" font-weight="400" fill="#1d3041">Who can act next, and which model will run?</text><rect x="56" y="529" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="74" y="563" font-size="24" font-weight="600" fill="#1d3041">Core task lifecycle</text><text x="74" y="597" font-size="21" font-weight="400" fill="#1d3041">Claim → handoff → review</text><text x="74" y="625" font-size="21" font-weight="400" fill="#1d3041">Guard each transition</text><path d="M410 590H428" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="529" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="450" y="563" font-size="24" font-weight="600" fill="#1d3041">Optional graph</text><text x="450" y="597" font-size="21" font-weight="400" fill="#1d3041">LangGraph orders steps</text><text x="450" y="625" font-size="21" font-weight="400" fill="#1d3041">and pauses for approval</text><path d="M786 590H804" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="808" y="529" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="826" y="563" font-size="24" font-weight="600" fill="#1d3041">Model policy</text><text x="826" y="597" font-size="21" font-weight="400" fill="#1d3041">Node override → rule</text><text x="826" y="625" font-size="21" font-weight="400" fill="#1d3041">→ approved default</text><text x="56" y="685" font-size="19" font-weight="400" fill="#1d3041">Principle: state machines + graph orchestration. Core use does not require a graph.</text><path d="M608 716V738" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="740" width="1152" height="290" rx="16" fill="#fff1df" stroke="#c8d3dc"/><text x="56" y="783" font-size="26" font-weight="600" fill="#835316">03</text><text x="112" y="783" font-size="29" font-weight="600" fill="#1d3041">Execution</text><text x="949" y="782" font-size="18" font-weight="600" fill="#835316">EXISTING RUNTIME</text><text x="56" y="820" font-size="22" font-weight="400" fill="#1d3041">How does an agent actually do the work?</text><rect x="56" y="845" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="74" y="879" font-size="24" font-weight="600" fill="#1d3041">Coding runtime</text><text x="74" y="913" font-size="21" font-weight="400" fill="#1d3041">Native agent by default</text><text x="74" y="941" font-size="21" font-weight="400" fill="#1d3041">Codex adapter: opt-in</text><path d="M410 906H428" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="845" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="450" y="879" font-size="24" font-weight="600" fill="#1d3041">Agent feedback loop</text><text x="450" y="913" font-size="21" font-weight="400" fill="#1d3041">Read → decide → use tools</text><text x="450" y="941" font-size="21" font-weight="400" fill="#1d3041">→ observe → continue</text><path d="M786 906H804" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="808" y="845" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="826" y="879" font-size="24" font-weight="600" fill="#1d3041">Approved environment</text><text x="826" y="913" font-size="21" font-weight="400" fill="#1d3041">Files, tests and tools</text><text x="826" y="941" font-size="21" font-weight="400" fill="#1d3041">Host enforces permissions</text><text x="56" y="1001" font-size="19" font-weight="400" fill="#1d3041">Principle: harness engineering. The runtime owns tool use; a prompt is not a sandbox.</text><path d="M608 1032V1054" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="1056" width="1152" height="290" rx="16" fill="#f0eafa" stroke="#c8d3dc"/><text x="56" y="1099" font-size="26" font-weight="600" fill="#65508a">04</text><text x="112" y="1099" font-size="29" font-weight="600" fill="#1d3041">Evidence + acceptance</text><text x="949" y="1098" font-size="18" font-weight="600" fill="#65508a">CORE / LOCAL</text><text x="56" y="1136" font-size="22" font-weight="400" fill="#1d3041">Did the delivered change meet the agreement?</text><rect x="56" y="1161" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="74" y="1195" font-size="24" font-weight="600" fill="#1d3041">Execution evidence</text><text x="74" y="1229" font-size="21" font-weight="400" fill="#1d3041">Results, time and usage</text><text x="74" y="1257" font-size="21" font-weight="400" fill="#1d3041">Unknown values stay null</text><path d="M410 1222H428" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="432" y="1161" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="450" y="1195" font-size="24" font-weight="600" fill="#1d3041">Exact candidate review</text><text x="450" y="1229" font-size="21" font-weight="400" fill="#1d3041">Git revision + checks</text><text x="450" y="1257" font-size="21" font-weight="400" fill="#1d3041">Declared review separation</text><path d="M786 1222H804" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="808" y="1161" width="352" height="119" rx="12" fill="#ffffff" stroke="#c8d3dc"/><text x="826" y="1195" font-size="24" font-weight="600" fill="#1d3041">Accepted task</text><text x="826" y="1229" font-size="21" font-weight="400" fill="#1d3041">Persist review + closeout</text><text x="826" y="1257" font-size="21" font-weight="400" fill="#1d3041">Keep the failure history</text><text x="56" y="1317" font-size="19" font-weight="400" fill="#1d3041">Principle: evidence-based verification. A completed graph is not an accepted task.</text><text x="32" y="1391" font-size="21" font-weight="400" fill="#1d3041">Optional runner persistence: SQLite checkpoints + dispatch journal. Uncertain effects stop for reconciliation.</text></g></svg>
