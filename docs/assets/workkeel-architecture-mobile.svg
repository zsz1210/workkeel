<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2172" viewBox="0 0 390 2172" role="img" aria-labelledby="title desc">
<title id="title">Workkeel architecture in four explanatory layers</title><desc id="desc">Task agreement defines authority. Coordination guards task states and optionally routes graph nodes. A coding runtime operates host-approved tools. Evidence and exact-candidate review determine acceptance. Optional runner checkpoints are not acceptance records.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536a7c" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="20" y="44" font-size="24" font-weight="600" fill="#1d3041">Workkeel · four layers</text><text x="20" y="78" font-size="14" font-weight="400" fill="#1d3041">Agreement → coordination → execution → evidence</text><rect x="12" y="108" width="366" height="478" rx="16" fill="#e8f0fa" stroke="#c8d3dc"/><text x="28" y="140" font-size="22" font-weight="600" fill="#1d3041">01  Task agreement</text><text x="28" y="167" font-size="13" font-weight="600" fill="#285b8b">CORE</text><rect x="28" y="186" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="214" font-size="19" font-weight="600" fill="#1d3041">Goal + acceptance</text><text x="42" y="241" font-size="16" font-weight="400" fill="#1d3041">One bounded change</text><text x="42" y="264" font-size="16" font-weight="400" fill="#1d3041">with checkable results</text><path d="M195 286V300" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="303" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="331" font-size="19" font-weight="600" fill="#1d3041">Environment + authority</text><text x="42" y="358" font-size="16" font-weight="400" fill="#1d3041">Read/write roots, tools,</text><text x="42" y="381" font-size="16" font-weight="400" fill="#1d3041">data policy and expiry</text><path d="M195 403V417" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="420" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="448" font-size="19" font-weight="600" fill="#1d3041">Task contract</text><text x="42" y="475" font-size="16" font-weight="400" fill="#1d3041">An approved record</text><text x="42" y="498" font-size="16" font-weight="400" fill="#1d3041">beside your code</text><text x="28" y="568" font-size="15" font-weight="500" fill="#1d3041">Repository records are the authority.</text><path d="M195 588V610" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="612" width="366" height="478" rx="16" fill="#e6f3ec" stroke="#c8d3dc"/><text x="28" y="644" font-size="22" font-weight="600" fill="#1d3041">02  Coordination</text><text x="28" y="671" font-size="13" font-weight="600" fill="#226b4d">CORE + OPT-IN</text><rect x="28" y="690" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="718" font-size="19" font-weight="600" fill="#1d3041">Core task lifecycle</text><text x="42" y="745" font-size="16" font-weight="400" fill="#1d3041">Claim → handoff → review</text><text x="42" y="768" font-size="16" font-weight="400" fill="#1d3041">Guard each transition</text><path d="M195 790V804" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="807" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="835" font-size="19" font-weight="600" fill="#1d3041">Optional graph</text><text x="42" y="862" font-size="16" font-weight="400" fill="#1d3041">LangGraph orders steps</text><text x="42" y="885" font-size="16" font-weight="400" fill="#1d3041">and pauses for approval</text><path d="M195 907V921" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="924" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="952" font-size="19" font-weight="600" fill="#1d3041">Model policy</text><text x="42" y="979" font-size="16" font-weight="400" fill="#1d3041">Node override → rule</text><text x="42" y="1002" font-size="16" font-weight="400" fill="#1d3041">→ approved default</text><text x="28" y="1072" font-size="15" font-weight="500" fill="#1d3041">Core use does not require a graph.</text><path d="M195 1092V1114" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="1116" width="366" height="478" rx="16" fill="#fff1df" stroke="#c8d3dc"/><text x="28" y="1148" font-size="22" font-weight="600" fill="#1d3041">03  Execution</text><text x="28" y="1175" font-size="13" font-weight="600" fill="#835316">EXISTING RUNTIME</text><rect x="28" y="1194" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="1222" font-size="19" font-weight="600" fill="#1d3041">Coding runtime</text><text x="42" y="1249" font-size="16" font-weight="400" fill="#1d3041">Native agent by default</text><text x="42" y="1272" font-size="16" font-weight="400" fill="#1d3041">Codex adapter: opt-in</text><path d="M195 1294V1308" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="1311" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="1339" font-size="19" font-weight="600" fill="#1d3041">Agent feedback loop</text><text x="42" y="1366" font-size="16" font-weight="400" fill="#1d3041">Read → decide → use tools</text><text x="42" y="1389" font-size="16" font-weight="400" fill="#1d3041">→ observe → continue</text><path d="M195 1411V1425" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="1428" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="1456" font-size="19" font-weight="600" fill="#1d3041">Approved environment</text><text x="42" y="1483" font-size="16" font-weight="400" fill="#1d3041">Files, tests and tools</text><text x="42" y="1506" font-size="16" font-weight="400" fill="#1d3041">Host enforces permissions</text><text x="28" y="1576" font-size="15" font-weight="500" fill="#1d3041">The host enforces tool permissions.</text><path d="M195 1596V1618" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="1620" width="366" height="478" rx="16" fill="#f0eafa" stroke="#c8d3dc"/><text x="28" y="1652" font-size="22" font-weight="600" fill="#1d3041">04  Evidence + acceptance</text><text x="28" y="1679" font-size="13" font-weight="600" fill="#65508a">CORE / LOCAL</text><rect x="28" y="1698" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="1726" font-size="19" font-weight="600" fill="#1d3041">Execution evidence</text><text x="42" y="1753" font-size="16" font-weight="400" fill="#1d3041">Results, time and usage</text><text x="42" y="1776" font-size="16" font-weight="400" fill="#1d3041">Unknown values stay null</text><path d="M195 1798V1812" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="1815" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="1843" font-size="19" font-weight="600" fill="#1d3041">Exact candidate review</text><text x="42" y="1870" font-size="16" font-weight="400" fill="#1d3041">Git revision + checks</text><text x="42" y="1893" font-size="16" font-weight="400" fill="#1d3041">Declared review separation</text><path d="M195 1915V1929" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="1932" width="334" height="99" rx="10" fill="#ffffff" stroke="#c8d3dc"/><text x="42" y="1960" font-size="19" font-weight="600" fill="#1d3041">Accepted task</text><text x="42" y="1987" font-size="16" font-weight="400" fill="#1d3041">Persist review + closeout</text><text x="42" y="2010" font-size="16" font-weight="400" fill="#1d3041">Keep the failure history</text><text x="28" y="2080" font-size="15" font-weight="500" fill="#1d3041">Execution completed ≠ task accepted.</text><text x="20" y="2143" font-size="16" font-weight="400" fill="#1d3041">Optional persistence: SQLite + journal</text></g></svg>
