<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1028" viewBox="0 0 390 1028" role="img" aria-labelledby="title desc">
<title id="title">Workkeel task lifecycle</title><desc id="desc">Intake, build, test, release_gate, done. Failed review returns to intake. Graph execution is optional and occurs during build.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536a7c" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="20" y="38" font-size="24" font-weight="600" fill="#1d3041">Workkeel · task lifecycle</text><text x="20" y="67" font-size="16" font-weight="400" fill="#1d3041">One task, five explicit states</text><rect x="20" y="91" width="350" height="123" rx="16" fill="#edf3fa" stroke="#c8d3dc"/><text x="36" y="122" font-size="22" font-weight="600" fill="#1d3041">1  Agree</text><text x="36" y="149" font-size="16" font-weight="500" fill="#285b8b">intake</text><text x="36" y="176" font-size="17" font-weight="400" fill="#1d3041">Scope, permissions</text><text x="36" y="199" font-size="17" font-weight="400" fill="#1d3041">and acceptance</text><path d="M195 216V238" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="242" width="350" height="123" rx="16" fill="#edf3fa" stroke="#c8d3dc"/><text x="36" y="273" font-size="22" font-weight="600" fill="#1d3041">2  Implement</text><text x="36" y="300" font-size="16" font-weight="500" fill="#285b8b">build</text><text x="36" y="327" font-size="17" font-weight="400" fill="#1d3041">Claim work; use your</text><text x="36" y="350" font-size="17" font-weight="400" fill="#1d3041">agent or a graph</text><path d="M195 367V389" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="393" width="350" height="123" rx="16" fill="#edf3fa" stroke="#c8d3dc"/><text x="36" y="424" font-size="22" font-weight="600" fill="#1d3041">3  Review</text><text x="36" y="451" font-size="16" font-weight="500" fill="#285b8b">test</text><text x="36" y="478" font-size="17" font-weight="400" fill="#1d3041">Check the exact</text><text x="36" y="501" font-size="17" font-weight="400" fill="#1d3041">candidate + evidence</text><path d="M195 518V540" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="544" width="350" height="123" rx="16" fill="#edf3fa" stroke="#c8d3dc"/><text x="36" y="575" font-size="22" font-weight="600" fill="#1d3041">4  Accept</text><text x="36" y="602" font-size="16" font-weight="500" fill="#285b8b">release_gate</text><text x="36" y="629" font-size="17" font-weight="400" fill="#1d3041">Confirm review and</text><text x="36" y="652" font-size="17" font-weight="400" fill="#1d3041">required approvals</text><path d="M195 669V691" fill="none" stroke="#536a7c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="695" width="350" height="123" rx="16" fill="#e6f3ec" stroke="#c8d3dc"/><text x="36" y="726" font-size="22" font-weight="600" fill="#1d3041">5  Done</text><text x="36" y="753" font-size="16" font-weight="500" fill="#285b8b">done</text><text x="36" y="780" font-size="17" font-weight="400" fill="#1d3041">Record the accepted</text><text x="36" y="803" font-size="17" font-weight="400" fill="#1d3041">revision; no deploy</text><rect x="20" y="852" width="350" height="122" rx="16" fill="#fff1df" stroke="#c8d3dc"/><text x="36" y="882" font-size="16" font-weight="400" fill="#1d3041">Review fails? Return to intake,</text><text x="36" y="906" font-size="16" font-weight="400" fill="#1d3041">keep the failed evidence, then claim</text><text x="36" y="930" font-size="16" font-weight="400" fill="#1d3041">the same scope again. An execution</text><text x="36" y="954" font-size="16" font-weight="400" fill="#1d3041">pause does not change task state.</text><text x="20" y="1004" font-size="17" font-weight="500" fill="#1d3041">Optional graph runs inside build.</text></g></svg>
