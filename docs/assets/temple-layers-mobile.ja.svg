<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc">
  <title id="title">Temple Concept Layers</title><desc id="desc">人の方針の下に、責任、作業、ガイダンス、連携、保証、記憶と学習があります。リポジトリの記憶がすべてを支えます。ガイダンスではコンテキストと実行方法のルーティングを分けます。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.title{fill:#f8fafc;font-size:25px;font-weight:650}.sub{fill:#94a3b8;font-size:15px}.label{fill:#7dd3fc;font-size:13px;font-weight:700;letter-spacing:1.2px}.name{fill:#f8fafc;font-size:19px;font-weight:650}.meta{fill:#a8b4c4;font-size:14px}.idx{fill:#5eead4;font-size:13px;font-weight:700}</style>
  <rect width="720" height="850" rx="18" fill="#0b0f14"/><text x="32" y="43" class="title">Temple Concept Layers</text><text x="32" y="70" class="sub">Temple がリポジトリに置く組織の構造。</text>
  <rect x="32" y="94" width="656" height="72" rx="12" fill="#142033" stroke="#60a5fa"/><text x="52" y="121" class="label">人の方針と権限</text><text x="52" y="147" class="meta">目標 · 優先順位 · 事業上の事実 · 承認</text>
  <line x1="52" y1="188" x2="52" y2="730" stroke="#2dd4bf" stroke-width="2"/>
  <g transform="translate(32 184)"><circle cx="20" cy="39" r="7" fill="#2dd4bf"/><rect x="38" width="618" height="78" rx="10" fill="#111820" stroke="#263341"/><text x="58" y="29" class="idx">L1</text><text x="98" y="29" class="name">責任</text><text x="98" y="55" class="meta">Position · Agent Identity · Assignment</text></g>
  <g transform="translate(32 274)"><circle cx="20" cy="39" r="7" fill="#2dd4bf"/><rect x="38" width="618" height="78" rx="10" fill="#0f161d" stroke="#263341"/><text x="58" y="29" class="idx">L2</text><text x="98" y="29" class="name">作業</text><text x="98" y="55" class="meta">Spec · Work Item · 受け入れ条件</text></g>
  <g transform="translate(32 364)"><circle cx="20" cy="39" r="7" fill="#2dd4bf"/><rect x="38" width="618" height="92" rx="10" fill="#0e2525" stroke="#2dd4bf"/><text x="58" y="29" class="idx">L3</text><text x="98" y="29" class="name">ガイダンス</text><text x="98" y="55" class="meta">Context Route · Skill</text><text x="98" y="77" class="meta">Adaptive Execution Route</text></g>
  <g transform="translate(32 468)"><circle cx="20" cy="39" r="7" fill="#2dd4bf"/><rect x="38" width="618" height="78" rx="10" fill="#0f161d" stroke="#263341"/><text x="58" y="29" class="idx">L4</text><text x="98" y="29" class="name">連携</text><text x="98" y="55" class="meta">Claim · 依存関係 · 並行作業 · Handoff</text></g>
  <g transform="translate(32 558)"><circle cx="20" cy="39" r="7" fill="#fbbf24"/><rect x="38" width="618" height="78" rx="10" fill="#251f11" stroke="#f59e0b"/><text x="58" y="29" class="idx" style="fill:#fbbf24">L5</text><text x="98" y="29" class="name">保証</text><text x="98" y="55" class="meta">Test · Eval · Independent QA · Release Gate</text></g>
  <g transform="translate(32 648)"><circle cx="20" cy="39" r="7" fill="#2dd4bf"/><rect x="38" width="618" height="78" rx="10" fill="#111820" stroke="#263341"/><text x="58" y="29" class="idx">L6</text><text x="98" y="29" class="name">記憶と学習</text><text x="98" y="55" class="meta">Evidence · Decision · Lesson · Recovery</text></g>
  <rect x="32" y="758" width="656" height="62" rx="10" fill="#171c24" stroke="#64748b"/><text x="52" y="785" class="label" style="fill:#cbd5e1">リポジトリに残る組織の記憶</text><text x="52" y="808" class="meta">正式 · バージョン管理 · 復元可能</text>
