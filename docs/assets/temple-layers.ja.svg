<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Temple Concept Layers</title>
  <desc id="desc">人の方針と権限の下に、責任、作業、ガイダンス、連携、保証、記憶と学習の六つの関心事があります。リポジトリに残る組織の記憶が全レイヤーを支えます。コンテキストルーティングと適応型実行ルーティングは別々の判断です。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; }
    .title { fill: #f8fafc; font-size: 28px; font-weight: 650; }
    .subtitle { fill: #94a3b8; font-size: 15px; }
    .eyebrow { fill: #7dd3fc; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
    .name { fill: #f8fafc; font-size: 18px; font-weight: 650; }
    .question { fill: #cbd5e1; font-size: 15px; }
    .mechanism { fill: #94a3b8; font-size: 14px; }
    .index { fill: #5eead4; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  </style>
  <rect width="1200" height="650" rx="18" fill="#0b0f14"/>
  <text x="48" y="48" class="title">Temple Concept Layers</text>
  <text x="48" y="74" class="subtitle">Temple がリポジトリに置く組織の構造。各レイヤーは別の問いに答えます。</text>
  <rect x="48" y="100" width="1104" height="66" rx="12" fill="#142033" stroke="#60a5fa"/>
  <text x="72" y="126" class="eyebrow">人の方針と権限</text>
  <text x="72" y="150" class="question">目標 · 優先順位 · 事業上の事実 · 承認の境界</text>
  <line x1="76" y1="185" x2="76" y2="556" stroke="#2dd4bf" stroke-width="2"/>
  <g transform="translate(48 184)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#111820" stroke="#263341"/><text x="70" y="25" class="index">L1</text><text x="116" y="25" class="name">責任</text><text x="370" y="25" class="question">誰が担当し、誰が承認できるか</text><text x="370" y="48" class="mechanism">Position · Agent Identity · Assignment · 実行者が変わっても責任の置き場所は変わらない</text></g>
  <g transform="translate(48 254)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#0f161d" stroke="#263341"/><text x="70" y="25" class="index">L2</text><text x="116" y="25" class="name">作業</text><text x="370" y="25" class="question">どの成果と境界が承認されたか</text><text x="370" y="48" class="mechanism">Spec · Work Item · 受け入れ条件 · タスクや会話が変わっても残る作業単位</text></g>
  <g transform="translate(48 324)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#0e2525" stroke="#2dd4bf"/><text x="70" y="25" class="index">L3</text><text x="116" y="25" class="name">ガイダンス</text><text x="370" y="25" class="question">何を読み、この手順をどう実行するか</text><text x="370" y="48" class="mechanism">Context Route · Skill · Adaptive Execution Route · 知識と実行方法の選択を分ける</text></g>
  <g transform="translate(48 394)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#0f161d" stroke="#263341"/><text x="70" y="25" class="index">L4</text><text x="116" y="25" class="name">連携</text><text x="370" y="25" class="question">人と Agent の間で安全にどう進めるか</text><text x="370" y="48" class="mechanism">Claim · 依存関係 · 並行作業 · Handoff · 重なりと統合責任を見える状態にする</text></g>
  <g transform="translate(48 464)"><circle cx="28" cy="31" r="7" fill="#fbbf24"/><rect x="48" width="1056" height="62" rx="10" fill="#251f11" stroke="#f59e0b"/><text x="70" y="25" class="index" style="fill:#fbbf24">L5</text><text x="116" y="25" class="name">保証</text><text x="370" y="25" class="question">次の判断を何の根拠で支えるか</text><text x="370" y="48" class="mechanism">Test · Evaluation · Independent QA · Release Gate · 異なる主張を別々に検証する</text></g>
  <g transform="translate(48 534)"><circle cx="28" cy="31" r="7" fill="#2dd4bf"/><rect x="48" width="1056" height="62" rx="10" fill="#111820" stroke="#263341"/><text x="70" y="25" class="index">L6</text><text x="116" y="25" class="name">記憶と学習</text><text x="370" y="25" class="question">次のタスクが何を復元し改善できるか</text><text x="370" y="48" class="mechanism">Evidence · Decision · Lesson · Recovery · 学びは確認されてから方針になる</text></g>
  <rect x="48" y="612" width="1104" height="2" fill="#475569"/>
  <text x="48" y="637" class="eyebrow" style="fill:#cbd5e1">リポジトリに残る組織の記憶 · 正式 · バージョン管理 · 復元可能</text>
</svg>
