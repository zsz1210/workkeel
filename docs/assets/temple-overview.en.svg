<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Temple system context and project-local mechanisms</title>
  <desc id="desc">A Human Principal sets outcomes, priorities, and approval boundaries. Temple provides four mechanisms in the project repository: organization and authority, work and context, coordination and delivery, and verification and learning. Human and AI executors work through clear responsibilities and return evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="relation-fill" d="M0 0 10 5 0 10Z"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="accent-fill" d="M0 0 10 5 0 10Z"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    .boundary { fill: #ffffff; stroke: #8c959f; }
    .component { fill: #e9f5f3; stroke: #4a9b92; }
    .actor { fill: #eef5ff; stroke: #7aa7df; }
    .repository { fill: #f6f8fa; stroke: #8c959f; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .accent { fill: #0f766e; }
    .accent-fill { fill: #0f766e; }
    .relation { fill: none; stroke: #59636e; }
    .relation-fill { fill: #59636e; }
    .accent-relation { fill: none; stroke: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .boundary { fill: #0d1117; stroke: #6e7681; }
      .component { fill: #102d2c; stroke: #2a7770; }
      .actor { fill: #15263d; stroke: #416b9f; }
      .repository { fill: #161b22; stroke: #6e7681; }
      .ink { fill: #f0f6fc; }
      .muted { fill: #9da7b3; }
      .accent { fill: #5eead4; }
      .accent-fill { fill: #5eead4; }
      .relation { stroke: #9da7b3; }
      .relation-fill { fill: #9da7b3; }
      .accent-relation { stroke: #5eead4; }
    }
  </style>

  <text class="muted" x="30" y="34" font-size="14" font-weight="700" letter-spacing="1.6">SYSTEM CONTEXT · PROJECT-LOCAL ORGANIZATION</text>

  <g>
    <rect class="actor" x="20" y="188" width="170" height="144" rx="7" stroke-width="2"/>
    <text class="ink" x="105" y="228" text-anchor="middle" font-size="19" font-weight="700">Human Principal</text>
    <text class="muted" x="105" y="255" text-anchor="middle" font-size="12" font-weight="650">DECISION MAKER</text>
    <line x1="42" y1="274" x2="168" y2="274" stroke="#7aa7df" opacity="0.45"/>
    <text class="muted" x="105" y="299" text-anchor="middle" font-size="11">Sets outcomes &amp; priorities</text>
    <text class="muted" x="105" y="321" text-anchor="middle" font-size="11">Approves risk exceptions</text>
  </g>

  <g>
    <rect class="actor" x="770" y="188" width="170" height="144" rx="7" stroke-width="2"/>
    <text class="ink" x="855" y="228" text-anchor="middle" font-size="19" font-weight="700">Humans + AI</text>
    <text class="muted" x="855" y="255" text-anchor="middle" font-size="13" font-weight="650">EXECUTORS</text>
    <line x1="792" y1="274" x2="918" y2="274" stroke="#7aa7df" opacity="0.45"/>
    <text class="muted" x="855" y="299" text-anchor="middle" font-size="11">Execute by Position</text>
    <text class="muted" x="855" y="321" text-anchor="middle" font-size="11">Return status &amp; evidence</text>
  </g>

  <g>
    <rect class="boundary" x="275" y="60" width="410" height="408" rx="10" stroke-width="2" stroke-dasharray="8 6"/>
    <text class="accent" x="294" y="96" font-size="27" font-weight="750">TEMPLE</text>
    <text class="muted" x="294" y="120" font-size="14">AI development organization installed in the project</text>
    <text class="muted" x="661" y="95" text-anchor="end" font-size="13" font-weight="650">FRAMEWORK BOUNDARY</text>

    <rect class="component" x="294" y="148" width="174" height="118" rx="6" stroke-width="2"/>
    <text class="ink" x="316" y="181" font-size="18" font-weight="700">Organization</text>
    <text class="muted" x="316" y="207" font-size="11">Roles &amp; approval</text>
    <text class="accent" x="316" y="238" font-size="13" font-weight="650">Position · Identity</text>
    <text class="accent" x="316" y="257" font-size="13" font-weight="650">Authority</text>

    <rect class="component" x="492" y="148" width="174" height="118" rx="6" stroke-width="2"/>
    <text class="ink" x="514" y="181" font-size="18" font-weight="700">Work &amp; context</text>
    <text class="muted" x="514" y="207" font-size="11">Outcome → work</text>
    <text class="accent" x="514" y="238" font-size="13" font-weight="650">Work Item · Spec</text>
    <text class="accent" x="514" y="257" font-size="13" font-weight="650">Context · Skill</text>

    <rect class="component" x="294" y="302" width="174" height="118" rx="6" stroke-width="2"/>
    <text class="ink" x="316" y="335" font-size="18" font-weight="700">Coordination</text>
    <text class="muted" x="316" y="361" font-size="11">Dependencies · handoffs</text>
    <text class="accent" x="316" y="392" font-size="13" font-weight="650">Claim · Dependency</text>
    <text class="accent" x="316" y="411" font-size="13" font-weight="650">Handoff · Revision</text>

    <rect class="component" x="492" y="302" width="174" height="118" rx="6" stroke-width="2"/>
    <text class="ink" x="514" y="335" font-size="18" font-weight="700">Verification</text>
    <text class="muted" x="514" y="361" font-size="11">Completion evidence</text>
    <text class="accent" x="514" y="392" font-size="13" font-weight="650">Test · Eval · QA</text>
    <text class="accent" x="514" y="411" font-size="13" font-weight="650">Evidence · Learning</text>

    <path class="accent-relation" d="M468 207H492" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <path class="accent-relation" d="M579 266V302" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <path class="accent-relation" d="M492 361H468" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <path class="accent-relation" d="M381 302V266" stroke-width="2" marker-end="url(#arrow-accent)"/>
  </g>

  <g font-size="11" font-weight="650">
    <path class="relation" d="M190 224H275" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="muted" x="232" y="210" text-anchor="middle">Directs</text>

    <path class="relation" d="M275 300H190" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text class="muted" x="232" y="322" text-anchor="middle">Approval</text>

    <path class="relation" d="M685 224H770" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="muted" x="728" y="210" text-anchor="middle">Work + context</text>

    <path class="relation" d="M770 300H685" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="muted" x="728" y="322" text-anchor="middle">Status + handoff</text>
  </g>

  <g>
    <rect class="repository" x="280" y="518" width="400" height="78" rx="7" stroke-width="2"/>
    <path class="accent-relation" d="M390 518V468" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <path class="accent-relation" d="M570 468V518" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text class="muted" x="348" y="493" text-anchor="middle" font-size="12" font-weight="650">Recover truth</text>
    <text class="muted" x="613" y="493" text-anchor="middle" font-size="12" font-weight="650">Write records</text>
    <text class="ink" x="480" y="550" text-anchor="middle" font-size="20" font-weight="700">Project repository · shared truth</text>
    <text class="muted" x="480" y="579" text-anchor="middle" font-size="13">Specs · decisions · state · code · tests · evidence · learning</text>
  </g>
</svg>
