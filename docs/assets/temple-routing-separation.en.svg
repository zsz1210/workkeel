<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Temple separates responsibility, context, and execution routing</title>
  <desc id="desc">An approved Work Item feeds three distinct routes. Responsibility routing selects who may own the step. Context routing selects what that position should read. Adaptive execution routing selects an eligible execution profile and requested settings. The routes meet at bounded Agent execution. Provider observations can later inform evidence and reviewed calibration, but no route grants authority or launches a provider.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif}.title{fill:#f8fafc;font-size:28px;font-weight:650}.sub{fill:#94a3b8;font-size:15px}.k{font-size:13px;font-weight:700;letter-spacing:1.2px}.h{fill:#f8fafc;font-size:20px;font-weight:650}.q{fill:#cbd5e1;font-size:15px}.m{fill:#94a3b8;font-size:14px}.small{fill:#94a3b8;font-size:13px}.chev{fill:#64748b;font-size:30px;font-weight:400}</style>
  <rect width="1200" height="660" rx="18" fill="#0b0f14"/><text x="48" y="50" class="title">Three routes answer three different questions</text><text x="48" y="77" class="sub">Responsibility is not context. Context is not execution configuration. None of them creates authority by itself.</text>
  <rect x="48" y="104" width="1104" height="62" rx="12" fill="#142033" stroke="#60a5fa"/><text x="72" y="130" class="k" fill="#7dd3fc">APPROVED INPUT</text><text x="72" y="151" class="q">Human direction · bounded Work Item · acceptance criteria · risk and authority boundary</text>

  <g transform="translate(48 198)"><rect width="336" height="190" rx="12" fill="#111820" stroke="#3b82f6"/><text x="22" y="32" class="k" fill="#7dd3fc">RESPONSIBILITY ROUTE</text><text x="22" y="68" class="h">Who may own this step?</text><text x="22" y="101" class="q">Position</text><text x="22" y="127" class="m">eligible Agent Identity</text><text x="22" y="153" class="m">assignment and authority boundary</text><text x="22" y="177" class="small">Capabilities never grant approval power.</text></g>
  <g transform="translate(432 198)"><rect width="336" height="190" rx="12" fill="#111820" stroke="#2dd4bf"/><text x="22" y="32" class="k" fill="#5eead4">CONTEXT ROUTE</text><text x="22" y="68" class="h">What should be read?</text><text x="22" y="101" class="q">Position · stage · purpose</text><text x="22" y="127" class="m">specs · decisions · Skills · evidence</text><text x="22" y="153" class="m">body-free selection manifest</text><text x="22" y="177" class="small">Selected sources remain the authority.</text></g>
  <g transform="translate(816 198)"><rect width="336" height="190" rx="12" fill="#0e2525" stroke="#2dd4bf"/><text x="22" y="32" class="k" fill="#5eead4">ADAPTIVE EXECUTION ROUTE</text><text x="22" y="68" class="h">How should it be attempted?</text><text x="22" y="101" class="q">Task Shape · required capabilities</text><text x="22" y="127" class="m">eligible execution profile</text><text x="22" y="153" class="m">requested model · reasoning · resources</text><text x="22" y="177" class="small">Advisory in the current Alpha.</text></g>

  <line x1="216" y1="388" x2="216" y2="425" stroke="#475569" stroke-width="2"/><line x1="600" y1="388" x2="600" y2="425" stroke="#475569" stroke-width="2"/><line x1="984" y1="388" x2="984" y2="425" stroke="#475569" stroke-width="2"/><line x1="216" y1="425" x2="984" y2="425" stroke="#475569" stroke-width="2"/><circle cx="600" cy="425" r="6" fill="#2dd4bf"/>
  <rect x="300" y="444" width="600" height="72" rx="12" fill="#142127" stroke="#2dd4bf"/><text x="324" y="474" class="h">Bounded Agent execution</text><text x="324" y="499" class="m">The selected owner uses routed sources and requested settings within the approved Work Item.</text>

  <g transform="translate(48 558)"><rect width="300" height="66" rx="10" fill="#171c24" stroke="#64748b"/><text x="20" y="28" class="k" fill="#cbd5e1">PROVIDER EXECUTION</text><text x="20" y="50" class="m">External execution boundary</text></g>
  <text x="369" y="601" class="chev">›</text>
  <g transform="translate(408 558)"><rect width="344" height="66" rx="10" fill="#171c24" stroke="#64748b"/><text x="20" y="28" class="k" fill="#cbd5e1">OBSERVED RESULT</text><text x="20" y="50" class="m">Effective settings · latency · Tokens · outcome</text></g>
  <text x="773" y="601" class="chev">›</text>
  <g transform="translate(812 558)"><rect width="340" height="66" rx="10" fill="#251f11" stroke="#f59e0b"/><text x="20" y="28" class="k" fill="#fbbf24">REVIEWED CALIBRATION</text><text x="20" y="50" class="m">Evidence may inform a later policy change</text></g>
  <text x="600" y="648" text-anchor="middle" class="small">No silent policy rewrite · no automatic Provider launch · no lifecycle progress without gate evidence</text>
</svg>
